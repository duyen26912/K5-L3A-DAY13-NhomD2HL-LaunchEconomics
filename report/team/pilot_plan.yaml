# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) · tính bằng src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (z chính xác 1,95996 và 0,84162)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 1.251 x 2,48 = 3.103 mỗi nhóm = 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m - 1) x 0,02) >= 859 nên m >= 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 cụm (nhân viên) mỗi nhóm
#
# Đánh đổi đã chấp nhận: chia theo nhân viên 20 + 20 chỉ đủ mẫu cho mức chênh 6 điểm (859 mỗi nhóm, mỗi người >= 299 yêu cầu),
#   không đủ cho 5 điểm (trần 1.000 < 1.251). Nếu tác động thật chỉ 5 điểm thì power còn khoảng 0,64. Giám đốc vận hành phải ký chấp nhận.
#   Chia theo yêu cầu đủ mẫu nhưng tràn tác động; chia theo depot chỉ có 6 cụm (< 20) nên bị loại.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%.
#   Trần tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên luật an toàn so với nhóm đối chứng (chênh từ 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang ở 6 depot đã chạy thử (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 -> 10 -> 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, luật dừng, seed bốc thăm và decision_date chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng hoặc báo đã hoàn khi sổ cái lỗi TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà trace KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công lớn hơn 8.000 đ [simulated] hoặc tỉ lệ làm lại trong phạm vi vượt 7% TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) lớn hơn 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo cáo PM KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn, hằng ngày; chỉ số chính chỉ đọc vào decision_date"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-05"
  simulated_inputs: ["phut_xem_lai_simulated (890 phút)", "phut_lam_lai_simulated (1.132 phút)", "chi phí mỗi việc thành công 4.472 đ", "chi phí theo loại 2.696 / 8.221 / 22.515 / 10.215 đ", "B4 xem lại 100%: 11.743 đ và 12.415 đ", "ngưỡng chi phí 8.000 đ trong luật dừng"]
